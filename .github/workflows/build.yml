name: Build Masterme4a M4

on:
  push:
    branches: [ main ]
    paths:
      - 'Masterme4a-M4-friends-source.zip'
      - '.github/workflows/build.yml'
      - '.github/scripts/fix_forge_compat.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'
      - name: Unpack source
        run: |
          mkdir source
          unzip Masterme4a-M4-friends-source.zip -d source
      - name: Apply Forge 1.17.1 compatibility fixes
        run: python3 .github/scripts/fix_forge_compat.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.3.3'
      - name: Build mod
        working-directory: source/Masterme4aClient-Forge-1.17.1
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Masterme4a-M4-Forge-1.17.1
          path: source/Masterme4aClient-Forge-1.17.1/build/libs/*.jar
          if-no-files-found: error
